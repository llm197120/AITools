# prd — Docker 管理端方案：构建并推送 homeai-backend + homeai-admin-web
name: Build & Push Docker (prd)

on:
  push:
    branches: [prd]
  workflow_dispatch:

env:
  ACR_REGISTRY: crpi-1is06jvzttfocl45.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: liulm
  IMAGE_BACKEND: homeai-backend
  IMAGE_ADMIN: homeai-admin-web

concurrency:
  group: build-push-docker-prd
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven package
        working-directory: JeecgBoot/jeecg-boot
        run: mvn -B clean package -Pdocker -pl jeecg-module-system/jeecg-system-start -am -DskipTests

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: JeecgBoot/jeecgboot-vue3/pnpm-lock.yaml

      - name: Build admin web
        working-directory: JeecgBoot/jeecgboot-vue3
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:docker:prod

      - name: Docker meta
        id: meta
        run: echo "image_tag=prd-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: JeecgBoot/jeecg-boot/jeecg-module-system/jeecg-system-start
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_BACKEND }}:prd-latest

      - name: Build & push admin web
        uses: docker/build-push-action@v6
        with:
          context: JeecgBoot/jeecgboot-vue3
          file: JeecgBoot/jeecgboot-vue3/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_ADMIN }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_ADMIN }}:prd-latest

      - name: Summary
        run: |
          echo "### Docker 方案 prd 构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "- 部署目录: \`JeecgBoot/deploy/frontend-docker/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 服务器: \`./deploy.sh prd\`" >> "$GITHUB_STEP_SUMMARY"
