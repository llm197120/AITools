# 主分支 / PR：编译验证，不推镜像、不部署
name: CI

on:
  pull_request:
    branches: [main, dev, prd]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven verify (homeai 单体)
        working-directory: JeecgBoot/jeecg-boot
        run: mvn -B clean package -Pdocker -pl jeecg-module-system/jeecg-system-start -am -DskipTests

  admin-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: JeecgBoot/jeecgboot-vue3/pnpm-lock.yaml

      - name: Install & build
        working-directory: JeecgBoot/jeecgboot-vue3
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:docker:prod
