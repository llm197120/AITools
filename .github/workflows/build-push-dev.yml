# dev 分支：构建并推送后端镜像至 ACR
name: Build & Push (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  ACR_REGISTRY: crpi-1is06jvzttfocl45.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: liulm
  IMAGE_BACKEND: homeai-backend

concurrency:
  group: build-push-dev
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven package
        working-directory: JeecgBoot/jeecg-boot
        run: mvn -B clean package -Pdocker -pl jeecg-module-system/jeecg-system-start -am -DskipTests

      - name: Docker meta
        id: meta
        run: echo "image_tag=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Check ACR secrets
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ]; then
            echo "::error::未配置 GitHub Secrets。请在仓库 Settings → Secrets and variables → Actions 中添加 ACR_USERNAME 和 ACR_PASSWORD"
            exit 1
          fi
          echo "ACR_USERNAME 已配置（长度 ${#ACR_USERNAME}）"

      - name: Login to ACR
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          echo "$ACR_PASSWORD" | docker login "${{ env.ACR_REGISTRY }}" -u "$ACR_USERNAME" --password-stdin

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: JeecgBoot/jeecg-boot/jeecg-module-system/jeecg-system-start
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_BACKEND }}:dev-latest

      - name: Summary
        run: |
          echo "### dev 后端构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "- 镜像: \`${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 服务器: \`JeecgBoot/deploy/frontend-nginx/deploy-backend.sh dev\`" >> "$GITHUB_STEP_SUMMARY"
