# prd — Nginx 管理端方案：推送 homeai-backend + 上传静态 dist（不推 admin 镜像）
name: Build & Push Nginx (prd)

on:
  push:
    branches: [prd]
  workflow_dispatch:

env:
  ACR_REGISTRY: crpi-1is06jvzttfocl45.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: liulm
  IMAGE_BACKEND: homeai-backend

concurrency:
  group: build-push-nginx-prd
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven package
        working-directory: JeecgBoot/jeecg-boot
        run: mvn -B clean package -Pdocker -pl jeecg-module-system/jeecg-system-start -am -DskipTests

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: JeecgBoot/jeecgboot-vue3/pnpm-lock.yaml

      - name: Build admin web (静态包)
        working-directory: JeecgBoot/jeecgboot-vue3
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:docker:prod

      - name: Docker meta
        id: meta
        run: echo "image_tag=prd-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: JeecgBoot/jeecg-boot/jeecg-module-system/jeecg-system-start
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_BACKEND }}:prd-latest

      - name: Upload admin dist
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-dist-prd
          path: JeecgBoot/jeecgboot-vue3/dist/
          retention-days: 90

      - name: Summary
        run: |
          echo "### Nginx 方案 prd 构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "- 部署目录: \`JeecgBoot/deploy/frontend-nginx/\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 后端: \`./deploy-backend.sh prd\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 静态: 下载 Artifact \`admin-web-dist-prd\` → \`./deploy-static.sh prd /path/to/dist\`" >> "$GITHUB_STEP_SUMMARY"
