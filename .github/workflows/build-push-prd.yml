# prd 分支：构建并推送后端镜像至 ACR
name: Build & Push (prd)

on:
  push:
    branches: [prd]
  workflow_dispatch:

env:
  ACR_REGISTRY: crpi-1is06jvzttfocl45.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: liulm
  IMAGE_BACKEND: homeai-backend

concurrency:
  group: build-push-prd
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven package
        working-directory: JeecgBoot/jeecg-boot
        run: mvn -B clean package -Pdocker -pl jeecg-module-system/jeecg-system-start -am -DskipTests

      - name: Docker meta
        id: meta
        run: echo "image_tag=prd-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Check ACR secrets
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          if [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ]; then
            echo "::error::请配置 GitHub Secrets: ACR_USERNAME=liulim, ACR_PASSWORD=访问凭证固定密码"
            exit 1
          fi
          U=$(printf '%s' "$ACR_USERNAME" | tr -d '[:space:]')
          P=$(printf '%s' "$ACR_PASSWORD" | tr -d '\r\n')
          echo "ACR_USERNAME=${U}（长度 ${#U}）"
          echo "ACR_PASSWORD 已配置（长度 ${#P}）"
          if [ "$U" != "liulim" ]; then
            echo "::warning::ACR 控制台登录用户名为 liulim，当前 Secret 值为「${U}」，若 login 失败请核对"
          fi
          echo "username=$U" >> "$GITHUB_ENV"
          echo "password=$P" >> "$GITHUB_ENV"

      - name: Login to ACR
        run: |
          echo "$password" | docker login --username="$username" "${{ env.ACR_REGISTRY }}" --password-stdin
          echo "Login Succeeded"

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: JeecgBoot/jeecg-boot/jeecg-module-system/jeecg-system-start
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_BACKEND }}:prd-latest

      - name: Summary
        run: |
          echo "### prd 后端构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "- login: \`docker login --username=liulim ${{ env.ACR_REGISTRY }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- push: \`${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ECS 拉取可用 VPC 域名: \`crpi-1is06jvzttfocl45-vpc.cn-hangzhou.personal.cr.aliyuncs.com/...\`" >> "$GITHUB_STEP_SUMMARY"
