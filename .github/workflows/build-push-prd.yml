# prd 分支：构建并推送后端镜像至 ACR
name: Build & Push (prd)

on:
  push:
    branches: [prd]
  workflow_dispatch:

env:
  ACR_REGISTRY: crpi-1is06jvzttfocl45.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: liulm
  IMAGE_BACKEND: homeai-backend

concurrency:
  group: build-push-prd
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven package
        working-directory: JeecgBoot/jeecg-boot
        run: mvn -B clean package -Pdocker -pl jeecg-module-system/jeecg-system-start -am -DskipTests

      - name: Docker meta
        id: meta
        run: echo "image_tag=prd-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: liulim
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: JeecgBoot/jeecg-boot/jeecg-module-system/jeecg-system-start
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_BACKEND }}:prd-latest

      - name: Summary
        run: |
          echo "### prd 后端构建完成" >> "$GITHUB_STEP_SUMMARY"
          echo "- login: \`docker login --username=liulim ${{ env.ACR_REGISTRY }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- push: \`${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_BACKEND }}:${{ steps.meta.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ECS 拉取可用 VPC 域名: \`crpi-1is06jvzttfocl45-vpc.cn-hangzhou.personal.cr.aliyuncs.com/...\`" >> "$GITHUB_STEP_SUMMARY"
