# 生产 — 宿主机 Nginx（frontend-nginx 方案）
# 由 deploy-static.sh 安装到 /etc/nginx/conf.d/homeai-admin.conf

server {
    listen 80;
    server_name _;

    root /var/www/homeai-admin;
    index index.html;

    location /jeecgboot/ {
        proxy_pass              http://127.0.0.1:8080/jeecg-boot/;
        proxy_redirect          off;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_read_timeout      300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/homeai-admin.access.log;
    error_log  /var/log/nginx/homeai-admin.error.log;
}
