# 开发 — 宿主机 Nginx（frontend-nginx 方案）

server {
    listen 8088;
    server_name _;

    root /var/www/homeai-admin-dev;
    index index.html;

    client_max_body_size 200m;

    location /jeecgboot/ {
        proxy_pass              http://127.0.0.1:8081/jeecg-boot/;
        proxy_redirect          off;
        proxy_set_header        Host $host;
        proxy_set_header        X-Real-IP $remote_addr;
        proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_read_timeout      300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/homeai-admin-dev.access.log;
    error_log  /var/log/nginx/homeai-admin-dev.error.log;
}
