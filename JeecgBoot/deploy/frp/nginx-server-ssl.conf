# 公网服务器 Nginx 入口（HTTPS）。安装到 /etc/nginx/sites-available/homeai
# 或覆盖 /etc/nginx/conf.d/homeai.conf
#
# 阿里云下载的 Nginx 证书放到：
#   /etc/nginx/ssl/liulm.top/fullchain.pem
#   /etc/nginx/ssl/liulm.top/privkey.key
# 本机 / FRP 隧道仍走 HTTP，只在这台机终止 TLS。

server {
    listen 80;
    server_name liulm.top www.liulm.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name liulm.top www.liulm.top;

    ssl_certificate     /etc/nginx/ssl/liulm.top/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/liulm.top/privkey.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 2g;

    location = /app {
        return 301 /app/;
    }
    location /app/ {
        alias /var/www/homeai-apk/;
        index index.html;
        autoindex off;
        add_header Cache-Control "no-store, must-revalidate" always;
        types {
            application/vnd.android.package-archive apk;
            text/html html;
            text/plain txt;
        }
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
